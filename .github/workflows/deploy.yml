name: Deploy to VPS

on:
  # Primary deploys: pull-deploy.timer on Caddy VM (.177) every 5 min via /srv/deploy/deploy.sh
  # This workflow is a manual fallback only (avoids racing the pull timer on every push).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podcast-page-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_caddy_deploy
          chmod 600 ~/.ssh/vps_caddy_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy static export to Caddy VM
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -d out
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/vps_caddy_deploy -o IdentitiesOnly=yes -o BatchMode=yes" \
            out/ "root@${VPS_HOST}:/srv/sites/whatisthisplace.org/public/"
