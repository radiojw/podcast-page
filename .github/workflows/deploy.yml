name: Deploy to VPS

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: podcast-page-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_lax1_deploy
          chmod 600 ~/.ssh/vps_lax1_deploy
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/vps_lax1_deploy
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy static export
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: >-
          rsync -av --delete
          -e "ssh -vvv -i $HOME/.ssh/vps_lax1_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o IPQoS=none -o ConnectTimeout=20 -o ConnectionAttempts=1"
          out/ "debian@${VPS_HOST}:/srv/sites/whatisthisplace.org/public/"
